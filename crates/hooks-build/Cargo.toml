[package]
name = "hooks-build"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "hooks-build"
path = "src/main.rs"

[lib]
name = "hooks_build"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde_json = "1.0"
wasmparser = "0.254"
wasm-encoder = { version = "0.254", features = ["wasmparser"] }
wasm-opt = "0.116"

[build-dependencies]
cc = "1"

[dev-dependencies]
wat = "1.254"
sha2 = "0.10"
wasmi = "0.46.0"

[lints]
workspace = true
