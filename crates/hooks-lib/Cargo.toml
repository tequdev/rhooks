[package]
name = "hooks-lib"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = true

[dependencies]
hooks-core = { path = "../hooks-core" }
hooks-macros = { path = "../hooks-macros" }

# Host-only, test-only: compiles the `tests/ui/*.rs` fixtures and diffs the
# resulting rustc output against the committed `.stderr` files, so the
# declaration macros' `compile_error!` diagnostics (which no ordinary test
# can observe — a failed compile has no test to run) stay pinned.
[dev-dependencies]
trybuild = "1"

[features]
default = ["panic-handler"]
panic-handler = []
# Provides a #[panic_handler] on non-wasm targets so host `cargo check`
# (rust-analyzer) works for no_std cdylib hook crates. Never enable this
# from a `std` context — see the handler's doc comment in lib.rs.
host-panic-handler = []
trace = []

[lints]
workspace = true
