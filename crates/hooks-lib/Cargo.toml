[package]
name = "hooks-lib"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = true

[dependencies]
hooks-core = { path = "../hooks-core" }
hooks-macros = { path = "../hooks-macros" }

[features]
default = ["panic-handler"]
panic-handler = []
# Provides a #[panic_handler] on non-wasm targets so host `cargo check`
# (rust-analyzer) works for no_std cdylib hook crates. Never enable this
# from a `std` context — see the handler's doc comment in lib.rs.
host-panic-handler = []
trace = []
# Native-host-only, opt-in (see `hooks-core`'s `testenv` feature and
# `crates/hooks-core/src/backend.rs`'s module doc): routes a curated subset
# of this crate's wrapper functions to a process-global backend instead of
# the default `NOT_IMPLEMENTED`. No effect on `wasm32` builds. Consumed by
# `hooks-testenv`, not meant to be enabled directly by hook crates.
testenv = ["hooks-core/testenv"]

[lints]
workspace = true
