[tools]
rust = "1.89.0"

[env]
XAHAUD_VERSION = "2026.6.21-release+3350"

[env._]
# Make the Rust proxy binaries available to mise tasks.
path = ["{{env.HOME}}/.local/share/mise/installs/rust/1.89.0"]

[tasks.fmt]
description = "Format the root workspace and the separate examples workspace"
run = """
cargo fmt --all
cargo fmt --all --manifest-path examples/Cargo.toml
"""

[tasks.lint]
description = "Lint the root workspace (all targets) and the examples workspace (wasm32v1-none), denying warnings"
run = """
cargo clippy --workspace --all-targets -- -D warnings
cargo clippy --manifest-path examples/Cargo.toml --workspace --target wasm32v1-none -- -D warnings
"""

[tasks.test]
description = "Run all workspace tests"
run = "cargo test --workspace"

[tasks.build-wasm]
description = "Build the no_std crates for the wasm32v1-none Hook target"
run = "cargo build -p rshooks-core -p rshooks --target wasm32v1-none --release"

[tasks.build-examples]
description = "Build every example through rshooks-build and check the output (end-to-end test)"
run = """
set -e

cargo run -p rshooks-build -- build --manifest-path examples/01_accept-all/Cargo.toml
cargo run -p rshooks-build -- check examples/01_accept-all/out/accept_all.wasm

cargo run -p rshooks-build -- build --manifest-path examples/02_state-counter/Cargo.toml
cargo run -p rshooks-build -- check examples/02_state-counter/out/state_counter.wasm

cargo run -p rshooks-build -- build --manifest-path examples/03_hook-params/Cargo.toml
cargo run -p rshooks-build -- check examples/03_hook-params/out/hook_params.wasm

cargo run -p rshooks-build -- build --manifest-path examples/04_errors/Cargo.toml
cargo run -p rshooks-build -- check examples/04_errors/out/errors.wasm

cargo run -p rshooks-build -- build --manifest-path examples/05_firewall/Cargo.toml
cargo run -p rshooks-build -- check examples/05_firewall/out/firewall.wasm

cargo run -p rshooks-build -- build --manifest-path examples/06_guard-patterns/Cargo.toml
cargo run -p rshooks-build -- check examples/06_guard-patterns/out/guard_patterns.wasm

cargo run -p rshooks-build -- build --manifest-path examples/07_xfl-math/Cargo.toml
cargo run -p rshooks-build -- check examples/07_xfl-math/out/xfl_math.wasm

cargo run -p rshooks-build -- build --manifest-path examples/08_slot-ledger/Cargo.toml
cargo run -p rshooks-build -- check examples/08_slot-ledger/out/slot_ledger.wasm

cargo run -p rshooks-build -- build --manifest-path examples/09_state-foreign/Cargo.toml
cargo run -p rshooks-build -- check examples/09_state-foreign/out/state_foreign.wasm

cargo run -p rshooks-build -- build --manifest-path examples/10_emit-txn/Cargo.toml
cargo run -p rshooks-build -- check examples/10_emit-txn/out/emit_txn.wasm

cargo run -p rshooks-build -- build --manifest-path examples/12_typed-data/Cargo.toml
cargo run -p rshooks-build -- check examples/12_typed-data/out/typed_data.wasm

cargo run -p rshooks-build -- build --manifest-path examples/13_keylets/Cargo.toml
cargo run -p rshooks-build -- check examples/13_keylets/out/keylets.wasm

cargo run -p rshooks-build -- build --manifest-path examples/14_account-id-macro/Cargo.toml
cargo run -p rshooks-build -- check examples/14_account-id-macro/out/account_id_macro.wasm

cargo run -p rshooks-build -- build --manifest-path examples/15_slot-objects/Cargo.toml
cargo run -p rshooks-build -- check examples/15_slot-objects/out/slot_objects.wasm

cargo run -p rshooks-build -- build --manifest-path examples/80_reward/Cargo.toml
cargo run -p rshooks-build -- check examples/80_reward/out/reward.wasm

cargo run -p rshooks-build -- build --manifest-path examples/81_govern/Cargo.toml
cargo run -p rshooks-build -- check examples/81_govern/out/govern.wasm
"""

[tasks."e2e:node-up"]
description = "Start a standalone Xahau node for e2e tests (xrpld-netgen; amd64 image, runs under emulation on Apple Silicon)"
run = "xrpld-netgen up:standalone --protocol xahau --version $XAHAUD_VERSION"

[tasks."e2e:node-down"]
description = "Stop the standalone Xahau node started by e2e:node-up"
run = "xrpld-netgen down:standalone --protocol xahau --version $XAHAUD_VERSION"

[tasks.e2e]
description = "Build the examples, then run the e2e suite against a node already started with `mise run e2e:node-up`"
depends = ["build-examples"]
run = """
set -e
pnpm --dir e2e install
pnpm --dir e2e test
"""
