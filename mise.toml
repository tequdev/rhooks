[tools]
# Pin the Rust toolchain for this project (exports RUSTUP_TOOLCHAIN=1.89.0,
# which the rustup argv0 proxies resolve).
rust = "1.89.0"

[env]
# rust-toolchain.toml's channel is "1.89.0", matching the [tools] rust pin
# above (which already exports RUSTUP_TOOLCHAIN=1.89.0) — no override
# needed here; both agree on a single stable toolchain.
XAHAUD_VERSION = "2026.6.21-release+3350"

[env._]
# mise's core rust tool (symlink install) does not register a bin dir on
# PATH itself, so add the proxy directory declaratively here. With this,
# every task below can call plain `cargo` — no per-task PATH surgery.
path = ["{{env.HOME}}/.local/share/mise/installs/rust/1.89.0"]

[tasks.fmt]
description = "Format the root workspace and the separate examples workspace"
run = """
cargo fmt --all
cargo fmt --all --manifest-path examples/Cargo.toml
"""

[tasks.lint]
description = "Lint the root workspace (all targets) and the examples workspace (wasm32v1-none), denying warnings"
run = """
cargo clippy --workspace --all-targets -- -D warnings
cargo clippy --manifest-path examples/Cargo.toml --workspace --target wasm32v1-none -- -D warnings
"""

[tasks.test]
description = "Run all workspace tests"
run = "cargo test --workspace"

[tasks.build-wasm]
description = "Build the no_std crates for the wasm32v1-none Hook target"
run = "cargo build -p hooks-core -p hooks-lib --target wasm32v1-none --release"

[tasks.build-examples]
description = "Build every example through hooks-build and check the output (end-to-end test)"
run = """
set -e

# Built in the numbered (suggested reading) order under examples/ — see
# examples/README.md. accept-all and state-counter are guard-clean at the
# source level (no compiler-generated loops survive to the final binary)
# and build with no extra flags.
cargo run -p hooks-build -- build --manifest-path examples/01_accept-all/Cargo.toml
cargo run -p hooks-build -- check examples/01_accept-all/out/accept_all.wasm

cargo run -p hooks-build -- build --manifest-path examples/02_state-counter/Cargo.toml
cargo run -p hooks-build -- check examples/02_state-counter/out/state_counter.wasm

# hook-params, errors, xfl-math, state-foreign, slot-ledger, and
# guard-patterns are all guard-clean at the source level too (see each
# example's own README for why) and build with no extra flags.
cargo run -p hooks-build -- build --manifest-path examples/03_hook-params/Cargo.toml
cargo run -p hooks-build -- check examples/03_hook-params/out/hook_params.wasm

cargo run -p hooks-build -- build --manifest-path examples/04_errors/Cargo.toml
cargo run -p hooks-build -- check examples/04_errors/out/errors.wasm

# firewall: compares the sender AccountId with hooks_lib::buf_eq_20 instead
# of `==` ([u8; 20] equality would compile to an unguarded, compiler-
# generated byte-compare loop). buf_eq_20 is loop-free by construction, so
# this builds with no extra flags — no --auto-guard, no maxiter to size.
cargo run -p hooks-build -- build --manifest-path examples/05_firewall/Cargo.toml
cargo run -p hooks-build -- check examples/05_firewall/out/firewall.wasm

cargo run -p hooks-build -- build --manifest-path examples/06_guard-patterns/Cargo.toml
cargo run -p hooks-build -- check examples/06_guard-patterns/out/guard_patterns.wasm

cargo run -p hooks-build -- build --manifest-path examples/07_xfl-math/Cargo.toml
cargo run -p hooks-build -- check examples/07_xfl-math/out/xfl_math.wasm

cargo run -p hooks-build -- build --manifest-path examples/08_slot-ledger/Cargo.toml
cargo run -p hooks-build -- check examples/08_slot-ledger/out/slot_ledger.wasm

cargo run -p hooks-build -- build --manifest-path examples/09_state-foreign/Cargo.toml
cargo run -p hooks-build -- check examples/09_state-foreign/out/state_foreign.wasm

# emit-txn: guard-clean with no flags — its own txn_template!-declared
# Payment (the whole emitted transaction, byte-exact, no `prepare()`
# involved) lives in a data segment (`static`) and doubles as its own
# output buffer, so no compiler-generated memset/memcpy loops exist.
cargo run -p hooks-build -- build --manifest-path examples/10_emit-txn/Cargo.toml
cargo run -p hooks-build -- check examples/10_emit-txn/out/emit_txn.wasm

# typed-data: #[derive(HookData)]-based composite state keys/values and
# otxn_param/hook_param structs. Guard-clean at the source level (see its
# own README's "Zero-cost: measured, not assumed" section) and builds with
# no extra flags.
cargo run -p hooks-build -- build --manifest-path examples/12_typed-data/Cargo.toml
cargo run -p hooks-build -- check examples/12_typed-data/out/typed_data.wasm

# keylets (11 is reserved for other in-flight work — see
# examples/README.md): 26 typed keylet_xxx helpers, one per KEYLET_*
# constant. No extra flags — this workspace's opt-level = 3 default
# (docs/DESIGN.md's §2 C6) already keeps Keylet's 34-byte scratch buffer
# under the zero-init-inlining threshold; see its own README's
# "Toolchain note" section.
cargo run -p hooks-build -- build --manifest-path examples/13_keylets/Cargo.toml
cargo run -p hooks-build -- check examples/13_keylets/out/keylets.wasm

# account-id-macro: its util_raddr scratch buffer is a `static`
# (hooks_lib::static_cell::HookStatic), same "avoid a compiler-generated
# zero-init loop" idiom as emit-txn above — a bare `[0u8; 34]` stack local
# was the one thing that needed it here.
cargo run -p hooks-build -- build --manifest-path examples/14_account-id-macro/Cargo.toml
cargo run -p hooks-build -- check examples/14_account-id-macro/out/account_id_macro.wasm

# slot-objects: the typed slot layer's live acceptance harness. Its two
# 300-iteration loops are `guard!`-bounded by their own iteration count, so
# it is guard-clean with no extra flags — see its own README for what each
# accept-code bit proves.
cargo run -p hooks-build -- build --manifest-path examples/15_slot-objects/Cargo.toml
cargo run -p hooks-build -- check examples/15_slot-objects/out/slot_objects.wasm

# 80+: production hooks (see examples/README.md's "80+" section). Both
# need every fallible Hook API call routed through their own `src/raw.rs`
# (bypassing hooks-lib's Result<_, HookError> wrapper) and reward/govern.c
# is the reader if you are debugging one of these two — no extra CLI
# flags either, per each crate's own README "Toolchain limitation"
# section.
cargo run -p hooks-build -- build --manifest-path examples/80_reward/Cargo.toml
cargo run -p hooks-build -- check examples/80_reward/out/reward.wasm

cargo run -p hooks-build -- build --manifest-path examples/81_govern/Cargo.toml
cargo run -p hooks-build -- check examples/81_govern/out/govern.wasm
"""

[tasks.fuzz-smoke]
description = """
Short CI-style smoke run of every cargo-fuzz target (fuzz/): each target
runs for 30s, just long enough to confirm the harness itself still builds
and executes cleanly. This is NOT part of `mise run test` (fuzzing is
open-ended and not meant to gate every change) and is not a substitute for
a real, longer fuzzing campaign — it only catches harness bit-rot. Requires
`cargo-fuzz` (`cargo install cargo-fuzz`) and a nightly toolchain
(cargo-fuzz needs nightly for `-Z sanitizer=address`). `fuzz/` pins its own
nightly (`fuzz/rust-toolchain.toml`), independent of this workspace's
`[tools] rust` stable pin above — see fuzz/README.md.
"""
run = """
# `+nightly-2026-07-20` (rather than relying on `fuzz/rust-toolchain.toml`'s
# directory-based override): this task's cwd is the repo root, whose own
# `rust-toolchain.toml` (stable) would otherwise win.
#
# `|| true` on every line: `txn_codec` (and, as of this writing,
# `build_pipeline`) currently find known, pre-existing bugs outside this
# lane's scope (see fuzz/README.md) almost immediately, and mise aborts the
# whole task on a command's first nonzero exit — a crashing target must not
# prevent the other targets from getting their smoke run.
cargo +nightly-2026-07-20 fuzz run --fuzz-dir fuzz xfl_decode -- -max_total_time=30 || true
cargo +nightly-2026-07-20 fuzz run --fuzz-dir fuzz txn_codec -- -max_total_time=30 || true
cargo +nightly-2026-07-20 fuzz run --fuzz-dir fuzz build_pipeline -- -max_total_time=30 || true
"""

[tasks."e2e:node-up"]
description = "Start a standalone Xahau node for e2e tests (xrpld-netgen; amd64 image, runs under emulation on Apple Silicon)"
run = "xrpld-netgen up:standalone --protocol xahau --version $XAHAUD_VERSION"

[tasks."e2e:node-down"]
description = "Stop the standalone Xahau node started by e2e:node-up"
run = "xrpld-netgen down:standalone --protocol xahau --version $XAHAUD_VERSION"

[tasks.e2e]
description = "Build the examples, then run the e2e suite against a node already started with `mise run e2e:node-up`"
depends = ["build-examples"]
run = """
set -e
pnpm --dir e2e install
pnpm --dir e2e test
"""
