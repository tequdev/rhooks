[tools]
# Pin the Rust toolchain for this project (exports RUSTUP_TOOLCHAIN=1.89.0,
# which the rustup argv0 proxies resolve).
rust = "1.89.0"

[env]
# The [tools] rust pin above exports RUSTUP_TOOLCHAIN=1.89.0, which would
# override rust-toolchain.toml's nightly channel; [env] is applied after
# [tools], so this wins and the rustup proxies below resolve the nightly.
RUSTUP_TOOLCHAIN = "nightly-2026-07-20"
XAHAUD_VERSION = "2026.6.21-release+3350"

[env._]
# mise's core rust tool (symlink install) does not register a bin dir on
# PATH itself, so add the proxy directory declaratively here. With this,
# every task below can call plain `cargo` — no per-task PATH surgery.
path = ["{{env.HOME}}/.local/share/mise/installs/rust/1.89.0"]

[tasks.fmt]
description = "Format the whole workspace"
run = "cargo fmt --all"

[tasks.lint]
description = "Lint the whole workspace (deny warnings)"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
description = "Run all workspace tests"
run = "cargo test --workspace"

[tasks.build-wasm]
description = "Build the no_std crates for the wasm32v1-none Hook target"
run = "cargo build -p hooks-core -p hooks-lib --target wasm32v1-none --release"

[tasks.build-examples]
description = "Build every example through hooks-build and check the output (end-to-end test)"
run = """
set -e

# accept-all and state-counter are guard-clean at the source level (no
# compiler-generated loops survive to the final binary) and build with no
# extra flags.
cargo run -p hooks-build -- build --manifest-path examples/accept-all/Cargo.toml
cargo run -p hooks-build -- check examples/accept-all/out/accept_all.wasm

cargo run -p hooks-build -- build --manifest-path examples/state-counter/Cargo.toml
cargo run -p hooks-build -- check examples/state-counter/out/state_counter.wasm

# firewall: compares the sender AccountId with hooks_lib::buf_eq_20 instead
# of `==` ([u8; 20] equality would compile to an unguarded, compiler-
# generated byte-compare loop). buf_eq_20 is loop-free by construction, so
# this builds with no extra flags — no --auto-guard, no maxiter to size.
cargo run -p hooks-build -- build --manifest-path examples/firewall/Cargo.toml
cargo run -p hooks-build -- check examples/firewall/out/firewall.wasm

# emit-txn: guard-clean with no flags — its own txn_template!-declared
# Payment (the whole emitted transaction, byte-exact, no `prepare()`
# involved) lives in a data segment (`static`) and doubles as its own
# output buffer, so no compiler-generated memset/memcpy loops exist.
cargo run -p hooks-build -- build --manifest-path examples/emit-txn/Cargo.toml
cargo run -p hooks-build -- check examples/emit-txn/out/emit_txn.wasm
"""

[tasks."e2e:node-up"]
description = "Start a standalone Xahau node for e2e tests (xrpld-netgen; amd64 image, runs under emulation on Apple Silicon)"
run = "xrpld-netgen up:standalone --protocol xahau --version $XAHAUD_VERSION"

[tasks."e2e:node-down"]
description = "Stop the standalone Xahau node started by e2e:node-up"
run = "xrpld-netgen down:standalone --protocol xahau --version $XAHAUD_VERSION"

[tasks.e2e]
description = "Build the examples, then run the e2e suite against a node already started with `mise run e2e:node-up`"
depends = ["build-examples"]
run = """
set -e
pnpm --dir e2e install
pnpm --dir e2e test
"""
