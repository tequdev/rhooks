[env]
# This machine's mise-managed Rust toolchain is not on PATH by default, and
# only its "rustup" multiplexer binary knows how to resolve the actual
# cargo/rustc paths (via RUSTUP_HOME / RUSTUP_TOOLCHAIN, already exported by
# mise's global rust tool). Every task below re-derives PATH from that.
_.path = ["{{env.HOME}}/.local/share/mise/installs/rust/1.89.0"]

[tasks.fmt]
description = "Format the whole workspace"
run = "sh -c 'export PATH=\"$(dirname \"$(rustup which cargo)\"):$PATH\"; cargo fmt --all'"

[tasks.lint]
description = "Lint the whole workspace (deny warnings)"
run = "sh -c 'export PATH=\"$(dirname \"$(rustup which cargo)\"):$PATH\"; cargo clippy --workspace --all-targets -- -D warnings'"

[tasks.test]
description = "Run all workspace tests"
run = "sh -c 'export PATH=\"$(dirname \"$(rustup which cargo)\"):$PATH\"; cargo test --workspace'"

[tasks.build-wasm]
description = "Build the no_std crates for the wasm32v1-none Hook target"
run = "sh -c 'export PATH=\"$(dirname \"$(rustup which cargo)\"):$PATH\"; cargo build -p hooks-core -p hooks-lib --target wasm32v1-none --release'"

[tasks.build-examples]
description = "Build every example through hooks-build and check the output (end-to-end test)"
run = """
sh -c '
export PATH="$(dirname "$(rustup which cargo)"):$PATH"
set -e

# accept-all and state-counter are guard-clean at the source level (no
# compiler-generated loops survive to the final binary) and build with no
# extra flags.
cargo run -p hooks-build -- build --manifest-path examples/accept-all/Cargo.toml
cargo run -p hooks-build -- check examples/accept-all/out/accept_all.wasm

cargo run -p hooks-build -- build --manifest-path examples/state-counter/Cargo.toml
cargo run -p hooks-build -- check examples/state-counter/out/state_counter.wasm

# firewall: `sender == blocked` ([u8; 20] equality) compiles to a
# compiler-generated byte-compare loop (no source-level loop exists).
# --auto-guard is required; maxiter=24 safely covers its true worst case
# of 20 iterations (one per AccountId byte), not just the --auto-guard
# default of 16.
cargo run -p hooks-build -- build --manifest-path examples/firewall/Cargo.toml --auto-guard --default-maxiter 24
cargo run -p hooks-build -- check examples/firewall/out/firewall.wasm

# emit-txn: zeroing the 320-byte `prepared` buffer compiles to a
# compiler_builtins-style memset loop (8 bytes/iteration). --auto-guard is
# required; maxiter=48 safely covers its true worst case of ~40
# iterations, not just the --auto-guard default of 16.
cargo run -p hooks-build -- build --manifest-path examples/emit-txn/Cargo.toml --auto-guard --default-maxiter 48
cargo run -p hooks-build -- check examples/emit-txn/out/emit_txn.wasm
'
"""
