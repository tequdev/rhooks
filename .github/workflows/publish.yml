name: Publish

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Verify with cargo publish --dry-run instead of publishing"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish crates to crates.io
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token exchange for crates.io Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Multi-package `cargo publish` needs cargo >= 1.90; rust-toolchain.toml
      # pins 1.89.0, so install stable alongside it rather than bump the pin.
      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal

      # Trusted Publishing only works for crates that already exist on
      # crates.io, so the very first publish falls back to the
      # CARGO_REGISTRY_TOKEN secret; once Trusted Publishing is configured
      # for all four crates, the secret can be deleted.
      - name: Authenticate with crates.io (Trusted Publishing)
        if: ${{ !inputs.dry-run }}
        id: auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo +stable publish -p rshooks-core -p rshooks-macros -p rshooks -p rshooks-build${{ inputs.dry-run && ' --dry-run' || '' }}

  release:
    name: Tag and create GitHub releases
    needs: publish
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (per rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      # One tag + release per published crate (rshooks-core-v0.1.0, ...),
      # mirroring the per-crate `cargo publish -p ...` list above. Safe to
      # re-run: an existing tag or release for a crate is left alone
      # instead of failing the job.
      - name: Tag and release each published crate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          crates_json=$(cargo metadata --no-deps --format-version=1 \
            | jq -c '[.packages[] | select(.name | IN("rshooks-core", "rshooks-macros", "rshooks", "rshooks-build")) | {name, version}]')

          count=$(jq 'length' <<<"$crates_json")
          if [ "$count" -ne 4 ]; then
            echo "::error::expected 4 published crates in cargo metadata, got $count" >&2
            exit 1
          fi

          jq -r '.[] | "\(.name) \(.version)"' <<<"$crates_json" | while read -r name version; do
            tag="${name}-v${version}"

            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "Tag $tag already exists, skipping tag/push"
            else
              git tag "$tag"
              git push origin "$tag"
            fi

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists, skipping"
            else
              gh release create "$tag" --title "$tag" --generate-notes
            fi
          done
