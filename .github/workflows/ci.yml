name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (per rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Check formatting (root workspace)
        run: cargo fmt --all --check

      - name: Check formatting (examples workspace)
        working-directory: examples
        run: cargo fmt --all --check

  build-test:
    name: Lint, build & test (root workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (per rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Generated hooks-core sources are up to date
        run: cargo run -q -p xtask -- gen-core --check

      - name: Clippy (host, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (wasm32v1-none, deny warnings)
        run: cargo clippy -p hooks-core -p hooks-lib --target wasm32v1-none -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Build no_std crates for wasm32v1-none
        run: cargo build -p hooks-core -p hooks-lib --target wasm32v1-none --release

  examples:
    name: Build & check examples (end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (per rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            examples

      - name: Clippy (examples, wasm32v1-none, deny warnings)
        # --lib instead of --all-targets: wasm32v1-none has no `test` crate,
        # so the implicit test-profile target can never build for it.
        working-directory: examples
        run: cargo clippy --workspace --lib --target wasm32v1-none -- -D warnings

      # Building each example through hooks-build and then `check`ing the
      # produced binary doubles as the end-to-end test of the whole
      # toolchain (cleaner, guard pass, validator) — no_std cdylib hooks
      # have no runnable unit tests. Built in the numbered (suggested
      # reading) order under examples/ — see examples/README.md — and kept
      # in sync manually with mise.toml's `build-examples` task and
      # e2e.yml's equivalent steps.
      #
      # accept-all and state-counter are guard-clean at the source level.
      - name: accept-all
        run: |
          cargo run -p hooks-build -- build --manifest-path examples/01_accept-all/Cargo.toml
          cargo run -p hooks-build -- check examples/01_accept-all/out/accept_all.wasm

      - name: state-counter
        run: |
          cargo run -p hooks-build -- build --manifest-path examples/02_state-counter/Cargo.toml
          cargo run -p hooks-build -- check examples/02_state-counter/out/state_counter.wasm

      # hook-params, errors, xfl-math, state-foreign, slot-ledger, and
      # guard-patterns are all guard-clean at the source level too (see
      # each example's own README for why) and build with no extra flags.
      - name: hook-params
        run: |
          cargo run -p hooks-build -- build --manifest-path examples/03_hook-params/Cargo.toml
          cargo run -p hooks-build -- check examples/03_hook-params/out/hook_params.wasm

      - name: errors
        run: |
          cargo run -p hooks-build -- build --manifest-path examples/04_errors/Cargo.toml
          cargo run -p hooks-build -- check examples/04_errors/out/errors.wasm

      # firewall: compares the sender AccountId with hooks_lib::buf_eq_20
      # instead of `==` ([u8; 20] equality would compile to an unguarded,
      # compiler-generated byte-compare loop). buf_eq_20 is loop-free by
      # construction, so this builds with no extra flags.
      - name: firewall
        run: |
          cargo run -p hooks-build -- build --manifest-path examples/05_firewall/Cargo.toml
          cargo run -p hooks-build -- check examples/05_firewall/out/firewall.wasm

      - name: guard-patterns
        run: |
          cargo run -p hooks-build -- build --manifest-path examples/06_guard-patterns/Cargo.toml
          cargo run -p hooks-build -- check examples/06_guard-patterns/out/guard_patterns.wasm

      - name: xfl-math
        run: |
          cargo run -p hooks-build -- build --manifest-path examples/07_xfl-math/Cargo.toml
          cargo run -p hooks-build -- check examples/07_xfl-math/out/xfl_math.wasm

      - name: slot-ledger
        run: |
          cargo run -p hooks-build -- build --manifest-path examples/08_slot-ledger/Cargo.toml
          cargo run -p hooks-build -- check examples/08_slot-ledger/out/slot_ledger.wasm

      - name: state-foreign
        run: |
          cargo run -p hooks-build -- build --manifest-path examples/09_state-foreign/Cargo.toml
          cargo run -p hooks-build -- check examples/09_state-foreign/out/state_foreign.wasm

      # emit-txn: guard-clean with no flags — its own txn_template!-declared
      # Payment (the whole emitted transaction, byte-exact, no `prepare()`
      # involved) lives in a data segment (`static`) and doubles as its own
      # output buffer, so no compiler-generated memset/memcpy loops exist.
      - name: emit-txn
        run: |
          cargo run -p hooks-build -- build --manifest-path examples/10_emit-txn/Cargo.toml
          cargo run -p hooks-build -- check examples/10_emit-txn/out/emit_txn.wasm

      # 80+: production hooks (examples/README.md's "80+" section). See
      # both crates' READMEs' "Toolchain limitation" sections for why
      # these two specifically need no extra build flags here despite
      # their size/complexity (a per-package opt-level = 3 override in
      # examples/Cargo.toml, not a hooks-build flag).
      - name: reward
        run: |
          cargo run -p hooks-build -- build --manifest-path examples/80_reward/Cargo.toml
          cargo run -p hooks-build -- check examples/80_reward/out/reward.wasm

      - name: govern
        run: |
          cargo run -p hooks-build -- build --manifest-path examples/81_govern/Cargo.toml
          cargo run -p hooks-build -- check examples/81_govern/out/govern.wasm

      - name: Upload example hook binaries
        uses: actions/upload-artifact@v7
        with:
          name: example-hooks
          path: examples/*/out/*.wasm
          if-no-files-found: error
