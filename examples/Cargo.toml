[workspace]
resolver = "3"
members = [
    "01_accept-all",
    "02_state-counter",
    "03_hook-params",
    "04_errors",
    "05_firewall",
    "06_guard-patterns",
    "07_xfl-math",
    "08_slot-ledger",
    "09_state-foreign",
    "10_emit-txn",
    "11_gas-counter",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "warn"

# Host `cargo check` of these no_std cdylibs (rust-analyzer) cannot use
# unwinding panics; wasm release builds abort anyway.
[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
