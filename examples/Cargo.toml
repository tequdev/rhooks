[workspace]
resolver = "3"
members = [
    "01_accept-all",
    "02_state-counter",
    "03_hook-params",
    "04_errors",
    "05_firewall",
    "06_guard-patterns",
    "07_xfl-math",
    "08_slot-ledger",
    "09_state-foreign",
    "10_emit-txn",
    "12_typed-data",
    "80_reward",
    "81_govern",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "warn"

# Host `cargo check` of these no_std cdylibs (rust-analyzer) cannot use
# unwinding panics; wasm release builds abort anyway.
[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# `reward`/`govern` (examples/README.md's "80+" section) need `opt-level =
# 3` specifically, not just "not z": see both crates' READMEs'
# "Toolchain limitation" sections — at `opt-level = "z"`, LLVM leaves
# enough dead `HookError`-decoding/error-handling machinery in place that
# `hook()` doesn't fit the Hook API's 32-level block/loop/if nesting
# limit once `hooks-build`'s Guard-type pipeline inlines every function in
# the crate into it, even after every source-level mitigation short of
# this. `opt-level`/`codegen-units` are the only `[profile]` keys Cargo
# allows overriding per package (`lto`/`panic`/`strip` are build-wide), so
# every other example keeps `opt-level = "z"` (optimize for size, the
# right default for a Hook binary) unaffected.
[profile.release.package.reward]
opt-level = 3
[profile.release.package.govern]
opt-level = 3
