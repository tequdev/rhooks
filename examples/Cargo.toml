[workspace]
resolver = "3"
members = ["accept-all", "firewall", "state-counter", "emit-txn", "gas-counter"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "warn"

# Host `cargo check` of these no_std cdylibs (rust-analyzer) cannot use
# unwinding panics; wasm release builds abort anyway.
[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
